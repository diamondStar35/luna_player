name: Setup Windows
description: Install the application build prerequisites.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - uses: actions/setup-python@v6
      with:
        python-version: 3.x
    - shell: pwsh
      run: |-
        python -m pip install --requirement docs/requirements.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        choco install gettext --yes --no-progress
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
