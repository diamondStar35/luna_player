name: Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate Metadata
        id: release_info
        shell: pwsh
        run: |
          & ./.githooks/check-version.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Release version validation failed."
          }

          $info = Get-Content -LiteralPath info.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $version = ([string]$info.version).Trim()
          $changes = @($info.changes | ForEach-Object { "* $(([string]$_).Trim())" })
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "archive=Luna_Player-v-$version.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer=Luna_Player-v-$version.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "changes_md<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $changes | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build tools
        shell: pwsh
        run: |
          $path = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $path | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Publish
        shell: pwsh
        run: dotnet publish src/LunaPlayer.csproj --configuration Release --nologo

      - name: Verify
        shell: pwsh
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          $executable = Get-Item 'src/bin/Release/net10.0-windows10.0.19041.0/win-x64/LunaPlayer.exe'
          $builtVersion = ([string]$executable.VersionInfo.ProductVersion).Split('+')[0]
          if ($builtVersion -ne $env:VERSION) {
            throw "Built application version '$builtVersion' does not match release version '$env:VERSION'."
          }

      - name: Create Archive
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ steps.release_info.outputs.archive }}
        run: |
          $publishDirectory = Resolve-Path 'src/bin/Release/net10.0-windows10.0.19041.0/win-x64'
          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $stageDirectory = Join-Path $env:RUNNER_TEMP "LunaPlayer-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $assetDirectory, $stageDirectory -Force | Out-Null

          & robocopy $publishDirectory $stageDirectory /E /XF *.pdb *.xml
          if ($LASTEXITCODE -ge 8) {
            throw "Could not stage the published application; robocopy exited with $LASTEXITCODE."
          }
          $global:LASTEXITCODE = 0

          $archivePath = Join-Path $assetDirectory $env:ARCHIVE_NAME
          Compress-Archive -Path "$stageDirectory\*" -DestinationPath $archivePath -CompressionLevel Optimal

      - name: Create Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: src/LunaPlayer.iss
          options: /O+
          install_latest: true

      - name: Stage
        shell: pwsh
        env:
          INSTALLER_NAME: ${{ steps.release_info.outputs.installer }}
        run: |
          $source = 'dist/LunaPlayerSetup.exe'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Expected installer '$source' was not created."
          }
          Copy-Item -LiteralPath $source -Destination (Join-Path 'release-assets' $env:INSTALLER_NAME)

      - name: Tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'GitHub Actions'
          git tag --force --annotate $env:RELEASE_TAG --message "Luna Player $env:RELEASE_TAG"
          git push origin "refs/tags/$env:RELEASE_TAG" --force

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Luna Player v${{ steps.release_info.outputs.version }}
          body: |
            ### Changes
            ${{ steps.release_info.outputs.changes_md }}

            ---
            Build from commit ${{ github.sha }}.
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/${{ steps.release_info.outputs.archive }}
            release-assets/${{ steps.release_info.outputs.installer }}
